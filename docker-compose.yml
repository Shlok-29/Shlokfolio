services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/portfolio
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      - mongo
volumes:
  mongo-data:
