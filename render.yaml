services:
  - type: web
    name: shlok-portfolio-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_USER
        value: Shlok-29
